services:
  server:
    build: ./server
    container_name: hotpulse-server
    env_file:
      - ./server/.env
    restart: unless-stopped
    volumes:
      - server_data:/app/data
      - server_prisma:/app/prisma
    networks:
      - hotpulse_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  client:
    build: ./client
    container_name: hotpulse-client
    ports:
      - "${HOST_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hotpulse_net

volumes:
  server_data:
    driver: local
  server_prisma:
    driver: local

networks:
  hotpulse_net:
    driver: bridge
